name: Review Astro build (no deployment)
on:
  pull_request:
  push:
    branches:
      - redesign/astro-portfolio-review
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: astro-site-preview
          path: dist/
          retention-days: 14
